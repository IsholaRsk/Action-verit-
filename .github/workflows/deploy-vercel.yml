name: Deploy to Vercel - EscortHub

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
        continue-on-error: true
        
      - name: Fallback - Trigger Vercel Deploy Hook
        if: failure()
        run: |
          echo "Vercel token not set or deploy failed - manual deploy needed"
          echo "Go to https://vercel.com/new/clone?repository-url=https://github.com/IsholaRsk/Action-verit-"
          echo "Or connect repo to existing Vercel project escortepointfr.store"
