/* =========================================================
   API LEGACY
   Paiements / annonces / authentification
========================================================= */

async function apiRequest(
  path,
  options = {}
) {

  const method =
    options.method || "GET";

  const headers = {
    "Content-Type": "application/json",
    ...(options.headers || {})
  };

  const response =
    await fetch(
      `${API_BASE}${path}`,
      {
        method,
        headers,
        credentials: "include",
        ...(options.body
          ? { body: options.body }
          : {})
      }
    );

  const text =
    await response.text();

  let payload = {};

  if (text) {

    try {

      payload = JSON.parse(text);

    } catch {

      payload = {
        message: text
      };

    }

  }

  if (!response.ok) {

    throw new Error(
      payload.error ||
      payload.message ||
      "Erreur API"
    );

  }

  return payload;

}


/* =========================================================
   CHARGEMENT ETAT
========================================================= */

async function hydrateState() {

  /*
   * PRODUITS
   *
   * Les produits viennent maintenant
   * directement de Supabase.
   */

  try {

    const {
      data,
      error
    } = await supabaseClient
      .from("products")
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );

    if (error) {

      console.error(
        "Erreur Supabase products :",
        error
      );

      appState.products = [];

    } else {

      appState.products =
        Array.isArray(data)
          ? data
          : [];

    }

  } catch (error) {

    console.error(
      "Erreur chargement produits :",
      error
    );

    appState.products = [];

  }


  /*
   * TEMPORAIRE :
   * Les autres données utilisent encore
   * l'ancien serveur.
   */

  try {

    const [
      paymentsRes,
      adsRes,
      settingsRes
    ] = await Promise.all([

      apiRequest("/payments"),

      apiRequest("/ads"),

      apiRequest("/settings")

    ]);


    appState.payments =
      Array.isArray(
        paymentsRes.payments
      )
        ? paymentsRes.payments
        : [];


    appState.ads =
      Array.isArray(
        adsRes.ads
      )
        ? adsRes.ads
        : [];


    appState.settings =
      settingsRes.settings ||
      {
        paymentRedirectUrl:
          "https://t.me/@IsholaRsk"
      };


    if (
      appState.settings.paymentRedirectUrl
    ) {

      localStorage.setItem(
        PAYMENT_REDIRECT_KEY,
        appState.settings.paymentRedirectUrl
      );

    }

  } catch (error) {

    console.warn(
      "Données legacy indisponibles :",
      error
    );

  }


  console.log(
    "Supabase connecté."
  );

  console.log(
    "Produits Supabase :",
    appState.products
  );

}

/* =========================================================

function getPaymentRedirectUrl() {

  try {

    const raw =
      localStorage.getItem(
        PAYMENT_REDIRECT_KEY

    if (
      raw &&
      raw.trim()
    ) {

      return raw;

    }

  } catch {}

  return (
    appState.settings.paymentRedirectUrl ||

}


function setPaymentRedirectUrl(url) {

  localStorage.setItem(
    PAYMENT_REDIRECT_KEY,

  appState.settings.paymentRedirectUrl =

}


function formatPrice(value) {

  return `$${Number(
    value || 0
  ).toLocaleString("en-US")}`;

}


function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


function readFileAsDataUrl(file) {

  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      reader.onload =
        () => resolve(
          reader.result
        );

      reader.onerror =
        reject;

      reader.readAsDataURL(file);

    }
  );

}

/* =========================================================
   PRODUITS SUPABASE
========================================================= */

function getProducts() {

  return appState.products || [];

/*
 * AJOUT / MODIFICATION
 *
 * Supabase upsert permet :
 * - INSERT si l'id n'existe pas
 * - UPDATE si l'id existe
 */

async function saveProducts(product) {

  const productData = {

    id: product.id,

    nom: product.nom,

    age: Number(
      product.age
    ),

    lieu: product.lieu,

    prix: Number(
      product.prix
    ),

    image: product.image

  };


  const {
    data,
    error
  } = await supabaseClient

    .from("products")

    .upsert(
      productData
    )

    .select()

    .single();


  if (error) {

    console.error(
      "Erreur sauvegarde produit :",
      error
    );

    throw new Error(
      error.message
    );

  }


  const index =
    appState.products.findIndex(
      item =>
        item.id === data.id
    );


  if (index >= 0) {

    appState.products[index] =
      data;

  } else {

    appState.products.unshift(
      data
    );

  }


  return {
    product: data
  };

}


/*
 * SUPPRESSION PRODUIT
 */

async function deleteProduct(id) {

  const {
    error
  } = await supabaseClient

    .from("products")

    .delete()

    .eq("id", id);


  if (error) {

    console.error(
      "Erreur suppression produit :",
      error
    );

    throw new Error(
      error.message
    );

  }


  appState.products =
    appState.products.filter(
      item =>
        item.id !== id
    );

}

/* =========================================================

========================================================= */

function setPaymentNotice(
  message,
  link = ""
) {

  localStorage.setItem(
    "escorhub-payment-notice",
    JSON.stringify({
      message,
      link
    })
  );

  renderNotice();

}


function clearPaymentNotice() {

  localStorage.removeItem(
    "escorhub-payment-notice"
  );

  renderNotice();

}


function renderNotice() {

  const notice =
    document.getElementById(
      "site-notice"
    );

  if (!notice) return;


  try {

    const raw =
      localStorage.getItem(
        "escorhub-payment-notice"
      );


    if (!raw) {

      notice.classList.add(
        "hidden"
      );

      notice.innerHTML = "";

      return;

    }


    const data =
      JSON.parse(raw);


    if (
      !data ||
      !data.message
    ) {

      notice.classList.add(
        "hidden"
      );

      notice.innerHTML = "";

      return;

    }


    notice.innerHTML =
      data.link

        ? `
          <p>
            ${escapeHtml(
              data.message
            )}

            <a
              href="${escapeHtml(
                data.link
              )}"
              target="_blank"
              rel="noopener noreferrer"
            >
              Poursuivre vers la discussion
            </a>
          </p>
        `

        : `
          <p>
            ${escapeHtml(
              data.message
            )}
          </p>
        `;


    notice.classList.remove(
      "hidden"
    );


  } catch {

    notice.classList.add(
      "hidden"
    );

    notice.innerHTML = "";

  }

}


/* =========================================================

========================================================= */

function startHeroSlideshow() {

  const hero =
    document.querySelector(
      ".hero"
    );

  if (!hero) return;


  let currentIndex = 0;


  const applyBackground =
    () => {

      const image =
        HERO_IMAGES[
          currentIndex
        ];


      hero.style.backgroundImage =
        `linear-gradient(
          rgba(0,0,0,.42),
          rgba(0,0,0,.8)
        ),
        url("${image}")`;


      currentIndex =
        (
          currentIndex + 1
        ) %
        HERO_IMAGES.length;

    };


  applyBackground();

  setInterval(
    applyBackground,
    50000
  );

}

/* =========================================================
   BANNIERE
========================================================= */

function renderBanner() {

  const banner =
    document.getElementById(
      "site-banner"
    );

  if (!banner) return;


  const ads =
    getAds()
      .filter(
        ad =>
          ad.status === "active"
      )
      .slice(0, 2);


  if (!ads.length) {

    banner.innerHTML = "";

    return;

  }


  banner.innerHTML = `

    <div class="banner-wrap banner-wrap-dual">

      ${
        ads.map(
          ad => {

            const mediaHtml =
              ad.mediaType ===
              "image"

                ? `
                  <img
                    src="${escapeHtml(
                      ad.mediaUrl
                    )}"
                    alt="${escapeHtml(
                      ad.title
                    )}"
                  />
                `

                : ad.mediaType ===
                  "video"

                  ? `
                    <video
                      controls
                      src="${escapeHtml(
                        ad.mediaUrl
                      )}"
                    ></video>
                  `

                  : `
                    <div class="banner-text">
                      ${escapeHtml(
                        ad.text ||
                        ad.title
                      )}
                    </div>
                  `;


            return `

              <div class="banner-item">

                ${mediaHtml}

                <div class="banner-copy">

                  <span class="banner-tag">
                    Annonce sponsorisée
                  </span>

                  <h3>
                    ${escapeHtml(
                      ad.title
                    )}
                  </h3>

                  <p>
                    ${escapeHtml(
                      ad.text ||
                      "Annonce sponsorisée"
                    )}
                  </p>

                </div>

              </div>

            `;

          }
        ).join("")
      }

    </div>

  `;

}

   AUTHENTIFICATION
   TEMPORAIREMENT LEGACY
========================================================= */

async function handleLoginSubmit(event) {

  event.preventDefault();


  const form =
    event.currentTarget;


  const username =
    form.username.value.trim();


  const password =
    form.password.value.trim();


  try {

    const result =
      await apiRequest(
        "/auth/login",
        {
          method: "POST",

          body:
            JSON.stringify({
              username,
              password
            })
        }
      );


    const user =
      result.user;


    setCurrentUser(
      user
    );


    window.location.hash =
      user.role === "admin"
        ? "#/admin"
        : "#/";


    await hydrateState();

    render();


  } catch (error) {

    alert(
      error.message ||
      "Identifiants incorrects."
    );

  }

}


async function handleSignupSubmit(event) {

  event.preventDefault();


  const form =
    event.currentTarget;


  const fullName =
    form.fullName.value.trim();


  const username =
    form.username.value.trim();


  const password =
    form.password.value.trim();


  if (
    !fullName ||
    !username ||
    !password
  ) {

    alert(
      "Veuillez remplir tous les champs."
    );

    return;

  }


  try {

    const result =
      await apiRequest(
        "/auth/signup",
        {
          method: "POST",

          body:
            JSON.stringify({
              fullName,
              username,
              password
            })
        }
      );


    setCurrentUser(
      result.user
    );


    await hydrateState();


    window.location.hash =
      "#/";


    render();


  } catch (error) {

    alert(
      error.message ||
      "Impossible de créer le compte."
    );

  }

}


/* =========================================================
   ADMIN PRODUIT
========================================================= */

async function handleAdminProductSubmit(
  event
) {

  event.preventDefault();


  const form =
    event.currentTarget;


  const id =
    form.id.value ||
    "p-" +
    Date.now();


  const file =
    form.imageUpload.files[0];


  let imageValue =
    form.image.value.trim();


  if (file) {

    imageValue =
      await readFileAsDataUrl(
        file
      );

  }


  const product = {

    id,

    nom:
      form.nom.value.trim(),

    age:
      Number(
        form.age.value
      ),

    lieu:
      form.lieu.value.trim(),

    prix:
      Number(
        form.prix.value
      ),

    image:
      imageValue

  };


  if (
    !product.nom ||
    !product.age ||
    !product.lieu ||
    !product.prix ||
    !product.image
  ) {

    alert(
      "Remplissez le nom, l’âge, le lieu, le prix et ajoutez une image ou une vidéo."
    );

    return;

  }


  try {

    /*
     * SUPABASE
     */
    await saveProducts(
      product
    );


    form.reset();

    document.getElementById(
      "product-id"
    ).value = "";


    alert(
      "Produit enregistré dans Supabase."
    );


    render();


  } catch (error) {

    alert(
      error.message ||
      "Impossible d’enregistrer le produit."
    );

  }

}


/* =========================================================
   ADMIN HANDLERS
========================================================= */

function attachAdminHandlers() {

  const form =
    document.getElementById(
      "admin-product-form"
    );


  if (form) {

    form.addEventListener(
      "submit",
      handleAdminProductSubmit
    );

  }


  const redirectForm =
    document.getElementById(
      "redirect-settings-form"
    );


  if (redirectForm) {

    redirectForm.addEventListener(
      "submit",
      event => {

        event.preventDefault();


        const input =
          document.getElementById(
            "payment-success-link"
          );


        const value =
          input.value.trim();


        if (!value) {

          alert(
            "Le lien de redirection est requis."
          );

          return;

        }


        setPaymentRedirectUrl(
          value
        );


        alert(
          "Le lien de redirection a été enregistré."
        );

      }
    );

  }


  const resetButton =
    document.getElementById(
      "reset-product-form"
    );


  if (resetButton) {

    resetButton.addEventListener(
      "click",
      () => {

        form.reset();

        document.getElementById(
          "product-id"
        ).value = "";

      }
    );

  }


  /*
   * MODIFIER PRODUIT
   */

  document
    .querySelectorAll(
      '[data-action="edit-product"]'
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const product =
              getProducts().find(
                item =>
                  item.id ===
                  button.dataset.id
              );


            if (!product) return;


            form.id.value =
              product.id;


            form.nom.value =
              product.nom ||
              product.title ||
              "";


            form.age.value =
              product.age ||
              "";


            form.lieu.value =
              product.lieu ||
              "";


            form.prix.value =
              product.prix ||
              product.price ||
              "";


            form.image.value =
              product.image ||
              "";

          }
        );

      }
    );


  /*
   * SUPPRIMER PRODUIT
   * DIRECTEMENT SUPABASE
   */

  document
    .querySelectorAll(
      '[data-action="delete-product"]'
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            const confirmed =
              confirm(
                "Supprimer ce produit de Supabase ?"
              );


            if (!confirmed)
              return;


            try {

              await deleteProduct(
                button.dataset.id
              );


              alert(
                "Produit supprimé de Supabase."
              );


              render();


            } catch (error) {

              alert(
                error.message ||
                "Impossible de supprimer le produit."
              );

            }

          }
        );

      }
    );


  /*
   * TEST PAIEMENT
   */

  document
    .querySelectorAll(
      '[data-action="check-payment"]'
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const payments =
              getPayments();


            const payment =
              payments.find(
                item =>
                  item.id ===
                  button.dataset.id
              );


            if (!payment)
              return;


            if (
              payment.method ===
              "transcash"
            ) {

              payment.validation =
                payment.amount > 0 &&
                !!payment.imageData
                  ? "valid"
                  : "invalid";

            } else {

              const digits =
                (
                  payment.cardNumber ||
                  ""
                ).replace(
                  /\s+/g,
                  ""
                );


              payment.validation =
                digits.length >= 12 &&
                payment.cardName
                  ? "valid"
                  : "invalid";

            }


            payment.checked =
              true;


            savePayments(
              payments
            );


            render();

          }
        );

      }
    );


  /*
   * ACCEPTER PAIEMENT
   */

  document
    .querySelectorAll(
      '[data-action="accept-payment"]'
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            const payments =
              getPayments();


            const payment =
              payments.find(
                item =>
                  item.id ===
                  button.dataset.id
              );


            if (!payment)
              return;


            payment.status =
              "accepted";


            payment.validation =
              payment.validation ||
              "valid";


            try {

              if (
                payment.target ===
                "ad"
              ) {

                const adPayload = {

                  id:
                    payment.adId ||
                    "ad-" +
                    Date.now(),

                  title:
                    payment.adTitle ||
                    "Annonce sponsorisée",

                  text:
                    payment.adText ||
                    "",

                  mediaType:
                    payment.mediaType ||
                    "text",

                  mediaUrl:
                    payment.mediaUrl ||
                    "",

                  status:
                    "active",

                  type:
                    "Annonce"

                };


                await apiRequest(
                  "/ads",
                  {
                    method: "POST",

                    body:
                      JSON.stringify(
                        adPayload
                      )
                  }
                );


                appState.ads.unshift(
                  adPayload
                );

              }


              await apiRequest(
                `/payments/${payment.id}`,
                {
                  method: "PATCH",

                  body:
                    JSON.stringify({
                      status:
                        "accepted",

                      validation:
                        "valid"
                    })
                }
              );


              clearPaymentNotice();


              window.location.href =
                getPaymentRedirectUrl();


            } catch (error) {

              alert(
                error.message ||
                "Impossible de valider le paiement."
              );

            }

          }
        );

      }
    );


  /*
   * DECLINER
   */

  document
    .querySelectorAll(
      '[data-action="decline-payment"]'
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          () => {

            const payments =
              getPayments();


            const payment =
              payments.find(
                item =>
                  item.id ===
                  button.dataset.id
              );


            if (!payment)
              return;


            payment.status =
              "declined";


            payment.validation =
              payment.validation ||
              "invalid";


            savePayments(
              payments
            );


            render();

          }
        );

      }
    );


  /*
   * SUPPRIMER ANNONCE
   */

  document
    .querySelectorAll(
      '[data-action="delete-ad"]'
    )
    .forEach(
      button => {

        button.addEventListener(
          "click",
          async () => {

            try {

              await apiRequest(
                `/ads/${button.dataset.id}`,
                {
                  method: "DELETE"
                }
              );


              appState.ads =
                appState.ads.filter(
                  item =>
                    item.id !==
                    button.dataset.id
                );


              render();


            } catch (error) {

              alert(
                error.message ||
                "Impossible de retirer l’annonce."
              );

            }

          }
        );

      }
    );


  /*
   * LOGOUT ADMIN
   */

  const logoutButton =
    document.getElementById(
      "admin-logout-btn"
    );


  if (logoutButton) {

    logoutButton.addEventListener(
      "click",
      logoutUser
    );

  }

}

/* =========================================================
   ACHAT PRODUIT
========================================================= */

async function handlePaymentSubmit(
  event
) {

  event.preventDefault();


  const form =
    event.currentTarget;


  const method =
    form.querySelector(
      'input[name="method"]:checked'
    ).value;


  const target =
    document.getElementById(
      "payment-target"
    ).value;


  const productId =
    document.getElementById(
      "payment-product-id"
    ).value;


  const adId =
    document.getElementById(
      "payment-ad-id"
    ).value;


  const amount =
    Number(
      document.getElementById(
        "payment-amount"
      ).value || 0
    );


  const user =
    getCurrentUser() || {
      username: "visiteur",
      role: "user"
    };


  const payment = {

    id:
      "pay-" +
      Date.now(),

    target,

    productId,

    adId,

    amount,

    method,

    user:
      user.username,

    status:
      "pending",

    validation:
      "pending",

    createdAt:
      new Date().toISOString()

  };


  try {

    if (
      method ===
      "transcash"
    ) {

      const fileInput =
        document.getElementById(
          "transcash-proof"
        );


      if (
        !fileInput.files[0]
      ) {

        alert(
          "Veuillez importer la preuve de recharge."
        );

        return;

      }


      payment.imageData =
        await readFileAsDataUrl(
          fileInput.files[0]
        );


      payment.amount =
        Number(
          document.getElementById(
            "transcash-amount"
          ).value || 0
        );

    } else {

      /*
       * Le traitement carte reste
       * temporaire avec l'ancien serveur.
       */

      const cardName =
        document.getElementById(
          "card-name"
        ).value.trim();


      const cardNumber =
        document.getElementById(
          "card-number"
        ).value.trim();


      const expiry =
        document.getElementById(
          "card-expiry"
        ).value.trim();


      const cvv =
        document.getElementById(
          "card-cvv"
        ).value.trim();


      if (
        !cardName ||
        !cardNumber ||
        !expiry ||
        !cvv
      ) {

        alert(
          "Veuillez remplir tous les champs de carte."
        );

        return;

      }


      payment.cardName =
        cardName;

      payment.cardNumber =
        cardNumber;

      payment.cardExpiry =
        expiry;

      payment.cardCvv =
        cvv;

    }


    const result =
      await apiRequest(
        "/payments",
        {
          method: "POST",

          body:
            JSON.stringify(
              payment
            )
        }
      );


    appState.payments.unshift(
      result.payment ||
      payment
    );


    closePaymentModal();


    setPaymentNotice(
      "Votre paiement est en cours de vérification."
    );


    render();


  } catch (error) {

    alert(
      error.message ||
      "Impossible d’enregistrer le paiement."
    );

  }

}


/* =========================================================
   ANNONCE
========================================================= */

async function handleAdSubmit(
  event
) {

  event.preventDefault();


  const form =
    event.currentTarget;


  const title =
    form.adTitle.value.trim();


  const text =
    form.adText.value.trim();


  const uploadFile =
    form.mediaUpload.files[0];


  let mediaType =
    form.mediaType.value;


  let mediaUrl =
    form.mediaUrl.value.trim();


  if (uploadFile) {

    mediaType =
      uploadFile.type.startsWith(
        "video/"
      )
        ? "video"
        : "image";


    mediaUrl =
      await readFileAsDataUrl(
        uploadFile
      );

  }


  if (
    !title ||
    (!text && !mediaUrl)
  ) {

    alert(
      "Le titre et le contenu de l’annonce sont requis."
    );

    return;

  }


  const user =
    getCurrentUser();


  if (!user) {

    alert(
      "Veuillez vous connecter pour poster une annonce."
    );


    window.location.hash =
      "#/login";


    render();

    return;

  }


  closeAdModal();


  openPaymentModal({

    target:
      "ad",

    amount:
      FIXED_AD_PRICE,

    title:
      "Paiement pour publication d’annonce",

    adId:
      "ad-" +
      Date.now()

  });


  const paymentForm =
    document.getElementById(
      "payment-form"
    );


  paymentForm.dataset.adTitle =
    title;


  paymentForm.dataset.adText =
    text;


  paymentForm.dataset.mediaType =
    mediaType;


  paymentForm.dataset.mediaUrl =
    mediaUrl;

}


/* =========================================================
   MODALS
========================================================= */

function bindModalControls() {

  document
    .getElementById(
      "close-payment-modal"
    )
    .addEventListener(
      "click",
      closePaymentModal
    );


  document
    .getElementById(
      "close-ad-modal"
    )
    .addEventListener(
      "click",
      closeAdModal
    );


  document
    .getElementById(
      "payment-form"
    )
    .addEventListener(
      "submit",
      async event => {

        const form =
          event.currentTarget;


        const target =
          document.getElementById(
            "payment-target"
          ).value;


        /*
         * PAIEMENT ANNONCE
         */

        if (
          target === "ad"
        ) {

          event.preventDefault();


          const method =
            form.querySelector(
              'input[name="method"]:checked'
            ).value;


          const amount =
            Number(
              document.getElementById(
                "payment-amount"
              ).value || 0
            );


          const paymentEntry = {

            id:
              "pay-ad-" +
              Date.now(),

            target:
              "ad",

            amount,

            method,

            user:
              (
                getCurrentUser() || {
                  username:
                    "visiteur"
                }
              ).username,

            status:
              "pending",

            validation:
              "pending",

            adTitle:
              form.dataset.adTitle ||
              "",

            adText:
              form.dataset.adText ||
              "",

            mediaType:
              form.dataset.mediaType ||
              "text",

            mediaUrl:
              form.dataset.mediaUrl ||
              "",

            adId:
              document.getElementById(
                "payment-ad-id"
              ).value ||
              "ad-" +
              Date.now(),

            createdAt:
              new Date().toISOString()

          };


          try {

            if (
              method ===
              "transcash"
            ) {

              const fileInput =
                document.getElementById(
                  "transcash-proof"
                );


              if (
                !fileInput.files[0]
              ) {

                alert(
                  "Veuillez importer la preuve de recharge."
                );

                return;

              }


              paymentEntry.imageData =
                await readFileAsDataUrl(
                  fileInput.files[0]
                );


              paymentEntry.amount =
                Number(
                  document.getElementById(
                    "transcash-amount"
                  ).value || 0
                );

            } else {

              const cardName =
                document.getElementById(
                  "card-name"
                ).value.trim();


              const cardNumber =
                document.getElementById(
                  "card-number"
                ).value.trim();


              const expiry =
                document.getElementById(
                  "card-expiry"
                ).value.trim();


              const cvv =
                document.getElementById(
                  "card-cvv"
                ).value.trim();


              if (
                !cardName ||
                !cardNumber ||
                !expiry ||
                !cvv
              ) {

                alert(
                  "Veuillez remplir tous les champs de carte."
                );

                return;

              }


              paymentEntry.cardName =
                cardName;

              paymentEntry.cardNumber =
                cardNumber;

              paymentEntry.cardExpiry =
                expiry;

              paymentEntry.cardCvv =
                cvv;

            }


            const result =
              await apiRequest(
                "/payments",
                {
                  method:
                    "POST",

                  body:
                    JSON.stringify(
                      paymentEntry
                    )
                }
              );


            appState.payments.unshift(
              result.payment ||
              paymentEntry
            );


            closePaymentModal();


            form.dataset.adTitle =
              "";

            form.dataset.adText =
              "";

            form.dataset.mediaType =
              "";

            form.dataset.mediaUrl =
              "";


            setPaymentNotice(
              "Votre paiement est en cours de vérification."
            );


            render();


          } catch (error) {

            alert(
              error.message ||
              "Impossible d’enregistrer le paiement."
            );

          }


          return;

        }


        /*
         * PAIEMENT PRODUIT
         */

        await handlePaymentSubmit(
          event
        );

      }
    );


  /*
   * FORMULAIRE ANNONCE
   */

  document
    .getElementById(
      "ad-form"
    )
    .addEventListener(
      "submit",
      handleAdSubmit
    );


  /*
   * METHODES PAIEMENT
   */

  document
    .querySelectorAll(
      'input[name="method"]'
    )
    .forEach(
      input => {

        input.addEventListener(
          "change",
          () => {

            const method =
              input.value;


            document
              .getElementById(
                "transcash-fields"
              )
              .classList.toggle(
                "hidden",
                method !==
                  "transcash"
              );


            document
              .getElementById(
                "card-fields"
              )
              .classList.toggle(
                "hidden",
                method !==
                  "card"
              );

          }
        );

      }
    );


  /*
   * PREVIEW TRANSCASH
   */

  document
    .getElementById(
      "transcash-proof"
    )
    .addEventListener(
      "change",
      async function () {

        const file =
          this.files[0];


        if (!file)
          return;


        try {

          const data =
            await readFileAsDataUrl(
              file
            );


          const preview =
            document.getElementById(
              "transcash-preview"
            );


          preview.innerHTML =
            `
              <img
                src="${data}"
                alt="Preuve de recharge"
              />
            `;


          preview.classList.remove(
            "hidden"
          );


        } catch {

          alert(
            "Le fichier ne peut pas être lu."
          );

        }

      }
    );

}


/* =========================================================
   CLICS GLOBAUX
========================================================= */

function handleGlobalClick(event) {

  /*
   * ACHETER PRODUIT
   */

  const buyButton =
    event.target.closest(
      '[data-action="buy"]'
    );


  if (buyButton) {

    const product =
      getProducts().find(
        item =>
          String(item.id) ===
          String(
            buyButton.dataset.id
          )
      );


    if (!product)
      return;


    openPaymentModal({

      target:
        "product",

      productId:
        product.id,

      amount:
        Number(
          product.prix ||
          product.price ||
          0
        ),

      title:
        `Paiement pour ${
          product.nom ||
          product.title ||
          "Profil"
        }`

    });


    return;

  }


  /*
   * POSTER ANNONCE
   */

  const postBtn =
    event.target.closest(
      "#post-ad-btn"
    );


  if (postBtn) {

    const user =
      getCurrentUser();


    if (!user) {

      window.location.hash =
        "#/login";

      render();

      return;

    }


    document
      .getElementById(
        "ad-modal"
      )
      .classList.remove(
        "hidden"
      );

  }

}


/* =========================================================
   LOGOUT
========================================================= */

function logoutUser() {

  localStorage.removeItem(
    STORAGE_KEYS.currentUser
  );


  window.location.hash =
    "#/";


  render();

}


/* =========================================================
   RENDER
========================================================= */

async function render() {

  const app =
    document.getElementById(
      "app"
    );


  const hash =
    window.location.hash ||
    "#/";


  const route =
    hash
      .replace("#", "")
      .split("/")
      .filter(Boolean)[0] ||
    "home";


  /*
   * LOGIN
   */

  if (
    route === "login"
  ) {

    app.innerHTML =
      renderLoginPage();


    document
      .getElementById(
        "login-form"
      )
      .addEventListener(
        "submit",
        handleLoginSubmit
      );

  }


  /*
   * SIGNUP
   */

  else if (
    route === "signup"
  ) {

    app.innerHTML =
      renderSignupPage();


    document
      .getElementById(
        "signup-form"
      )
      .addEventListener(
        "submit",
        handleSignupSubmit
      );

  }


  /*
   * ADMIN
   */

  else if (
    route === "admin"
  ) {

    const current =
      getCurrentUser();


    if (
      !current ||
      current.role !== "admin"
    ) {

      window.location.hash =
        "#/login";


      render();

      return;

    }


    app.innerHTML =
      renderAdminPage();


    attachAdminHandlers();

  }


  /*
   * PRODUCTS
   */

  else if (
    route === "products"
  ) {

    app.innerHTML =
      renderProductsPage();

  }


  /*
   * DISCUSSION
   */

  else if (
    route === "discussion"
  ) {

    app.innerHTML =
      renderDiscussionPage();

  }


  /*
   * HOME
   */

  else if (
    route === "home" ||
    route === ""
  ) {

    app.innerHTML =
      renderHome();

  }


  /*
   * 404
   */

  else {

    app.innerHTML =
      renderNotFound();

  }


  renderBanner();

  renderNotice();

  startHeroSlideshow();


  /*
   * HEADER
   */

  const user =
    getCurrentUser();


  const loginLink =
    document.getElementById(
      "login-link"
    );


  const signupLink =
    document.getElementById(
      "signup-link"
    );


  const logoutBtn =
    document.getElementById(
      "logout-btn"
    );


  let adminLink =
    document.getElementById(
      "admin-link"
    );


  const footerYear =
    document.getElementById(
      "footer-year"
    );


  if (footerYear) {

    footerYear.textContent =
      new Date().getFullYear();

  }


  if (
    user &&
    user.role === "admin"
  ) {

    if (!adminLink) {

      adminLink =
        document.createElement(
          "a"
        );


      adminLink.id =
        "admin-link";


      adminLink.href =
        "#/admin";


      adminLink.className =
        "nav-link";


      adminLink.textContent =
        "Admin";


      document
        .querySelector(
          ".header-actions"
        )
        .appendChild(
          adminLink
        );

    }


    loginLink.classList.add(
      "hidden"
    );


    signupLink.classList.add(
      "hidden"
    );


    logoutBtn.classList.remove(
      "hidden"
    );

  } else {

    if (adminLink)
      adminLink.remove();


    loginLink.classList.remove(
      "hidden"
    );


    signupLink.classList.remove(
      "hidden"
    );


    logoutBtn.classList.add(
      "hidden"
    );

  }

}


/* =========================================================
   INITIALISATION
========================================================= */

document
  .getElementById(
    "logout-btn"
  )
  .addEventListener(
    "click",
    logoutUser
  );


document.body.addEventListener(
  "click",
  handleGlobalClick
);


bindModalControls();


window.addEventListener(
  "hashchange",
  () => render()
);


/*
 * TEST SUPABASE
 */

testSupabase();


/*
 * CHARGEMENT INITIAL
 */

hydrateState()
  .then(
    () => render()
  )
  .catch(
    error => {

      console.error(
        "Erreur initialisation :",
        error
      );

      render();

    }
  );

</script>
